<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Event</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            Student Events - Admin
        </div>

        <div class="nav-links">
            <a href="{{ url_for('admin') }}">Dashboard</a>

            <a href="{{ url_for('add_event') }}">
                Add Event
            </a>

            <a href="{{ url_for('admin_logout') }}"
               class="logout">
                Logout
            </a>
        </div>

    </nav>


    <!-- Main Content -->
    <div class="container">

        <h1>Edit Event</h1>

        <div class="form-card">

            <form method="POST">

                <!-- Event Name -->
                <label>Event Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ event['name'] }}"
                    required
                >


                <!-- Date -->
                <label>Date</label>

                <input
                    type="text"
                    name="date"
                    value="{{ event['date'] }}"
                    required
                >


                <!-- Time -->
                <label>Time</label>

                <input
                    type="text"
                    name="time"
                    value="{{ event['time'] }}"
                    required
                >


                <!-- Venue -->
                <label>Venue</label>

                <input
                    type="text"
                    name="venue"
                    value="{{ event['venue'] }}"
                    required
                >


                <!-- Buttons -->
                <button type="submit">
                    Update Event
                </button>

                <a href="{{ url_for('admin') }}"
                   class="cancel-btn">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</body>
</html>
