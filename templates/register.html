<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <a href="{{ url_for('home') }}" class="navbar-title">
            Student Events
        </a>

        <div class="navbar-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </nav>


    <!-- Registration Form -->
    <div class="form-container">

        <h1>Create Account</h1>

        <p>Register as a student</p>


        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash-message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Registration Form -->
        <form method="POST"
              action="{{ url_for('register') }}">

            <!-- Name -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <!-- Department -->
            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <input
                    type="text"
                    id="department"
                    name="department"
                    placeholder="Enter your department"
                >

            </div>


            <!-- Submit -->
            <button type="submit"
                    class="form-submit">
                Register
            </button>

        </form>


        <!-- Login Link -->
        <div class="form-link">

            <p>
                Already have an account?
                <a href="{{ url_for('login') }}">
                    Login here
                </a>
            </p>

        </div>

    </div>

</body>

</html>
