<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <!-- CSS Connection -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <a href="{{ url_for('home') }}" class="navbar-title">
            Student Events
        </a>

        <div class="navbar-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </div>

    </nav>


    <!-- Login Form -->
    <div class="form-container">

        <h1>Student Login</h1>

        <p>Login to manage your college events</p>


        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash-message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Login Form -->
        <form method="POST"
              action="{{ url_for('login') }}">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit"
                    class="form-submit">
                Login
            </button>

        </form>


        <!-- Register Link -->
        <div class="form-link">

            <p>
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Register here
                </a>
            </p>

        </div>

    </div>

</body>

</html>
